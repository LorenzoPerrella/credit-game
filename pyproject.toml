[project]
name = "creditsurv"
version = "0.1.0"
description = "Lifetime PD modelling with parametric survival models, time-varying covariates and interval censoring"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Lorenzo Perrella", email = "lorenzo.perrella@gmail.com" }]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "lifelines>=0.30,<0.31",
    "pandas>=2.1,<3.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "pyarrow>=15.0",
    "typer>=0.12",
    "requests>=2.31",
    "duckdb>=1.5.5",
]

# The compiled kernel is **optional at import**: `uv sync --extra kernel` builds it, and
# everything works without it. Rule 13 of docs/rules.md says why the NumPy path stays
# normative, and nobody needs a Rust toolchain to run this project.
[project.optional-dependencies]
kernel = ["creditsurv-kernel"]

[project.scripts]
creditsurv = "creditsurv.cli:app"

# One workspace, two members: this package stays pure Python under hatchling, and the crate is
# built by maturin beside it. The boundary between the two languages is one function; see
# `crates/creditsurv-kernel/src/lib.rs` and rule 13.
[tool.uv.workspace]
members = ["crates/creditsurv-kernel"]

[tool.uv.sources]
creditsurv-kernel = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.1",
    "types-requests>=2.31",
    "nbconvert>=7.17.1",
    "ipykernel>=7.3.0",
    "plotly>=7.1.0",
    "mkdocs>=1.6,<2",
]
# MkDocs 2 removes the plugin and theme systems the site is built on.
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.7.7",
    "plotly>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/creditsurv"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "TC", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Notebooks and tests may use assert-heavy, fixture-driven style.
"tests/**" = ["ANN401"]

[tool.mypy]
files = ["src", "tests"]
# Analyse as 3.12 even on the 3.11 CI job: numpy ships stubs written with 3.12
# `type` statements, which mypy refuses to parse under an older target. Syntax
# compatibility with 3.11 is enforced by ruff's target-version instead, and the
# 3.11 matrix job still runs the test suite for real.
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_unreachable = true

# lifelines and autograd ship no type information. Everything the project
# itself exposes stays strictly typed; only the third-party surface is relaxed.
#
# `creditsurv_kernel` is the compiled kernel, and it is in this list for a reason beyond
# convenience: it is **optional at import**, so the type checker has to pass whether or not the
# extension is installed. What is checked instead is the behaviour -- the equivalence tests
# compare it against the NumPy kernel, which is normative.
[[tool.mypy.overrides]]
module = [
    "lifelines.*",
    "autograd.*",
    "formulaic.*",
    "scipy.*",
    "pyarrow.*",
    "plotly.*",
    "creditsurv_kernel.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "network: test performs a live network call (deselect with -m 'not network')",
]
