{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}
  {#- plotly.js in the head, before the inline scripts that draw each figure, and only on the
      pages that have one. -#}
  {% if page and page.meta and page.meta.plotly %}
    <script src="{{ 'javascripts/plotly.min.js' | url }}"></script>
  {% endif %}
{% endblock %}
