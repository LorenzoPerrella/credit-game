name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # 05:20 UTC daily: the quality matrix, the live-data check and the end-to-end pipeline.
    - cron: "20 5 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.13 is deliberately excluded until autograd support is verified
        # locally; lifelines differentiates through autograd on every fit.
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      # Network tests are deselected here and run by the nightly job instead,
      # so an upstream outage can never fail an unrelated pull request.
      - name: Test
        run: uv run pytest -m "not network" --cov=creditsurv --cov-report=term-missing

      # Rule 13: the suite runs **twice** on both Python legs, with and without the compiled
      # kernel, so neither path can rot. `models/kernel/terms.py` is normative and the
      # extension is optional at import, which is only true while something checks it.
      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies, with the compiled kernel
        run: uv sync --frozen --extra kernel

      # `extension-module` is off by default so a test binary can link, which is what lets the
      # arithmetic have unit tests of its own: the compensated sum, the capped exponential and
      # the chain's shortcut on a zero factor.
      - name: Lint and test the crate
        run: |
          cargo fmt --manifest-path crates/creditsurv-kernel/Cargo.toml -- --check
          cargo clippy --manifest-path crates/creditsurv-kernel/Cargo.toml --release -- -D warnings
          cargo test --manifest-path crates/creditsurv-kernel/Cargo.toml --release

      - name: Test again, with the compiled kernel
        run: uv run pytest -m "not network"

      - name: Build distribution
        run: uv build

  site:
    name: build the site
    # Built from the views committed under docs/tables: the loan data cannot reach CI, so
    # `creditsurv views` computes them locally and this job only draws them.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --group docs

      # Strict: a broken link, a missing anchor, a placeholder naming nothing or a view the
      # manifest does not list fails the build.
      - name: Build
        run: uv run mkdocs build --strict

      - name: Upload the site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/

  deploy:
    name: publish the site
    # Only from main, and only when the tests pass too: a site describing a model whose
    # suite is red would publish figures nobody should read yet.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, site]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

  policy:
    name: policy
    # The repository invariants the commit hook checks on a staged diff, checked here on the
    # whole pull request by the same module (.claude/hooks/policy.py): a hook binds only the
    # agent that runs it, and a commit made by hand or on another machine passes it untouched.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The range is origin/main...HEAD, so the history to the merge base has to be here.
          fetch-depth: 0

      - name: Check the pull request's diff
        run: python3 .claude/hooks/policy.py --range origin/${{ github.base_ref }}...HEAD

  network:
    name: live FRED check
    # Only on the nightly schedule or an explicit run. Never on a pull request:
    # an upstream outage must not fail an unrelated change.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      # Asserts the endpoint, the CSV layout and the column naming are unchanged.
      # This connector is the one component that can break with no local change.
      - name: Live data check
        run: uv run pytest -m network -v

  pipeline-smoke:
    name: end-to-end pipeline
    # On every pull request as well as nightly. It was kept off the pull-request path as "minutes
    # rather than seconds", and it takes 53 seconds; meanwhile `--loans` failed it every night
    # from 29 October to 1 November 2026, because no pull request ran it and nobody read the
    # schedule. Integration breakage is found where the change is made.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      # Deliberately small: this asks whether the commands still compose, not
      # whether the estimates are good. The test suite answers the second.
      #
      # The book is generated because the real dataset cannot be downloaded
      # programmatically -- registration is free but manual -- and it is written into
      # the same nested archives the download has, so ingest and the per-quarter
      # aggregation run for real rather than being skipped.
      - name: Run the pipeline
        run: |
          # FRED is live, and an outage of a minute must not fail an unrelated pull request:
          # three attempts, thirty seconds apart, before the job says the code is broken.
          for attempt in 1 2 3; do
            uv run creditsurv fetch-macro && break
            if [ "$attempt" = 3 ]; then exit 1; fi
            echo "fetch-macro failed, attempt $attempt of 3; retrying in 30 s"
            sleep 30
          done
          uv run python tests/smoke_book.py
          uv run creditsurv ingest
          uv run creditsurv profile
          uv run creditsurv aggregate
          uv run creditsurv portfolio
          uv run creditsurv fit
          uv run creditsurv backtest --as-of 2024-06
          # `--loans` went when the projection book became a declared window of originations
          # (`BOOK_WINDOW_MONTHS`) rather than the heaviest cells ever written, and this line kept
          # it -- so the scheduled run failed every day on `No such option: --loans` and nothing
          # read it. The simulated book draws from the last 96 months, so the year to 2024-06 has
          # about 190 originations in it.
          uv run creditsurv report --as-of 2024-06 --book-months 12 --horizon 24

      - name: Check the reports were written
        run: |
          for name in methodology calibration backtesting; do
            test -s "docs/reports/$name.md" || { echo "missing docs/reports/$name.md"; exit 1; }
          done
          # Named rather than counted: a count passes while the figure the run was
          # supposed to produce is the one missing, because the others are committed.
          for name in survival_vs_km coefficients term_structure scenarios \
                      calibration backtest_over_time new_lending outstanding_book \
                      macro_panel; do
            test -s "docs/reports/figures/$name.png" || {
              echo "missing docs/reports/figures/$name.png"; exit 1; }
          done

      - name: Upload reports
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: docs/reports/

  scheduled-failure:
    name: report a scheduled failure
    # A scheduled run that fails says so where it will be read: one tracking issue, opened on the
    # first failure and commented on after that, instead of a red mark on a page nobody opens.
    needs: [quality, network, pipeline-smoke]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Scheduled CI is failing"
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "Failed again: $RUN"
          else
            gh issue create --title "$title" --body "The scheduled run failed: $RUN"
          fi
