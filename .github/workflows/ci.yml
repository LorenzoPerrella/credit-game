name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # 05:20 UTC daily. Only the live-data job runs on this trigger.
    - cron: "20 5 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.13 is deliberately excluded until autograd support is verified
        # locally; lifelines differentiates through autograd on every fit.
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      # Network tests are deselected here and run by the nightly job instead,
      # so an upstream outage can never fail an unrelated pull request.
      - name: Test
        run: uv run pytest -m "not network" --cov=creditsurv --cov-report=term-missing

      - name: Build distribution
        run: uv build

  network:
    name: live FRED check
    # Only on the nightly schedule or an explicit run. Never on a pull request:
    # an upstream outage must not fail an unrelated change.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      # Asserts the endpoint, the CSV layout and the column naming are unchanged.
      # This connector is the one component that can break with no local change.
      - name: Live data check
        run: uv run pytest -m network -v

  pipeline-smoke:
    name: end-to-end pipeline
    # Nightly and on demand. The full pipeline fetches live data, fits a model and
    # writes reports, which is minutes rather than seconds -- too slow for the
    # pull-request path, and it is integration breakage it catches, not logic.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      # Deliberately small: this asks whether the commands still compose, not
      # whether the estimates are good. The test suite answers the second.
      - name: Run the pipeline
        run: |
          uv run creditsurv fetch-macro
          uv run creditsurv build-data --n-loans 600 --seed 7
          uv run creditsurv fit
          uv run creditsurv report --loans 100 --folds 2 --horizon 24

      - name: Check the reports were written
        run: |
          for name in methodology calibration backtesting; do
            test -s "docs/reports/$name.md" || { echo "missing docs/reports/$name.md"; exit 1; }
          done
          test -d docs/reports/figures && test "$(ls -1 docs/reports/figures | wc -l)" -ge 4

      - name: Upload reports
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: docs/reports/
