name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # 05:20 UTC daily. Only the live-data job runs on this trigger.
    - cron: "20 5 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.13 is deliberately excluded until autograd support is verified
        # locally; lifelines differentiates through autograd on every fit.
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      # Network tests are deselected here and run by the nightly job instead,
      # so an upstream outage can never fail an unrelated pull request.
      - name: Test
        run: uv run pytest -m "not network" --cov=creditsurv --cov-report=term-missing

      - name: Build distribution
        run: uv build

  site:
    name: build the site
    # Built from the views committed under docs/tables: the loan data cannot reach CI, so
    # `creditsurv views` computes them locally and this job only draws them.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --group docs

      # Strict: a broken link, a missing anchor, a placeholder naming nothing or a view the
      # manifest does not list fails the build.
      - name: Build
        run: uv run mkdocs build --strict

      - name: Upload the site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/

  deploy:
    name: publish the site
    # Only from main, and only when the tests pass too: a site describing a model whose
    # suite is red would publish figures nobody should read yet.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, site]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

  network:
    name: live FRED check
    # Only on the nightly schedule or an explicit run. Never on a pull request:
    # an upstream outage must not fail an unrelated change.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      # Asserts the endpoint, the CSV layout and the column naming are unchanged.
      # This connector is the one component that can break with no local change.
      - name: Live data check
        run: uv run pytest -m network -v

  pipeline-smoke:
    name: end-to-end pipeline
    # Nightly and on demand. The full pipeline fetches live data, fits a model and
    # writes reports, which is minutes rather than seconds -- too slow for the
    # pull-request path, and it is integration breakage it catches, not logic.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      # Deliberately small: this asks whether the commands still compose, not
      # whether the estimates are good. The test suite answers the second.
      #
      # The book is generated because the real dataset cannot be downloaded
      # programmatically -- registration is free but manual -- and it is written into
      # the same nested archives the download has, so ingest and the per-quarter
      # aggregation run for real rather than being skipped.
      - name: Run the pipeline
        run: |
          uv run creditsurv fetch-macro
          uv run python tests/smoke_book.py
          uv run creditsurv ingest
          uv run creditsurv profile
          uv run creditsurv aggregate
          uv run creditsurv portfolio
          uv run creditsurv fit
          uv run creditsurv backtest --as-of 2024-06
          uv run creditsurv report --as-of 2024-06 --loans 200 --horizon 24

      - name: Check the reports were written
        run: |
          for name in methodology calibration backtesting; do
            test -s "docs/reports/$name.md" || { echo "missing docs/reports/$name.md"; exit 1; }
          done
          # Named rather than counted: a count passes while the figure the run was
          # supposed to produce is the one missing, because the others are committed.
          for name in survival_vs_km coefficients term_structure scenarios \
                      calibration backtest_over_time new_lending outstanding_book \
                      macro_panel; do
            test -s "docs/reports/figures/$name.png" || {
              echo "missing docs/reports/figures/$name.png"; exit 1; }
          done

      - name: Upload reports
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: docs/reports/
